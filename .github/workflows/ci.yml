# jolt-net CI.
#
# Two independent jobs, because they prove different things and have very
# different prerequisites:
#
#   probe — compiles tools/probe-constants.c against each platform's OWN headers
#           and runs it. Needs only a C compiler, so it covers all three
#           platforms. This is what turns the per-target socket tables from
#           remembered numbers into checked ones, and it is the only way the
#           macOS column becomes real.
#
#   test  — the full suite on the minimum released Jolt version claimed by the
#           library. The release binary is self-contained, so this lane also
#           verifies that no source-checkout or proposal-fork coupling remains.
#
# Windows is deliberately probe-only for now. The current Jolt runtime path and
# real Winsock calls have not been characterized together, so source-building
# Chez here would turn an ABI claim into a misleading runtime-coverage claim.
# That distinction is stated here rather than hidden, and
# docs/PLATFORM-COVERAGE.md says the same.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  probe:
    name: probe ABI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Compile and run the ABI probe
        shell: bash
        run: |
          set -eu
          cc=""
          for c in cc gcc clang; do
            if command -v "$c" >/dev/null 2>&1; then cc="$c"; break; fi
          done
          [ -n "$cc" ] || { echo "no C compiler found"; exit 1; }
          echo "using $cc"
          mkdir -p tools/probed
          "$cc" -O0 -o probe tools/probe-constants.c
          # Strip CR so Windows output is comparable to the others.
          ./probe | tr -d '\r' > probe.edn
          cat probe.edn
          os=$(sed -n 's/^{:os :\([a-z0-9-]*\).*/\1/p' probe.edn)
          arch=$(sed -n 's/^ :arch :\([a-z0-9-]*\).*/\1/p' probe.edn)
          cp probe.edn "tools/probed/$os-$arch.edn"
          echo "PROBE_FILE=tools/probed/$os-$arch.edn" >> "$GITHUB_ENV"

      - name: Upload probed ABI facts
        uses: actions/upload-artifact@v4
        with:
          name: probed-${{ matrix.os }}
          # Upload only the file produced on this runner.  The checkout already
          # contains the other committed probes; uploading the whole directory
          # makes the aggregate job compare (for example) the committed Darwin
          # file copied by a Linux runner against Darwin's real probe.
          path: ${{ env.PROBE_FILE }}

  # Fail if any committed descriptor disagrees with what that platform's headers
  # actually say. A drift here is not cosmetic -- a wrong struct offset is memory
  # corruption -- so this gates rather than warns.
  tables:
    name: tables match probed headers
    needs: probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: probed-artifacts
      - name: Compare committed facts against every freshly probed platform
        shell: bash
        run: |
          set -eu
          echo "== freshly probed on the runners =="
          find probed-artifacts -name '*.edn' | sort
          echo
          drift=0
          new=0
          # Compare against what is COMMITTED (tools/probed in the checkout).
          # Do not copy over it first, or there would be nothing left to compare.
          for f in $(find probed-artifacts -name '*.edn' | sort); do
            base=$(basename "$f")
            committed="tools/probed/$base"
            if [ ! -f "$committed" ]; then
              echo "NEW: $base has no committed counterpart yet"
              echo "     (expected the first time a platform joins CI)"
              sed 's/^/       /' "$f"
              new=1
              continue
            fi
            # Compare with line endings normalized: a Windows runner checks the
            # committed files out as CRLF, which would otherwise show up as
            # every line differing from itself.
            tr -d '\r' < "$committed" > /tmp/a.edn
            tr -d '\r' < "$f" > /tmp/b.edn
            if diff -u /tmp/a.edn /tmp/b.edn > "/tmp/$base.diff"; then
              echo "OK:  $base matches the committed facts"
            else
              echo "DRIFT: $base disagrees with this platform's real headers"
              sed 's/^/       /' "/tmp/$base.diff"
              drift=1
            fi
          done
          echo
          if [ "$new" = 1 ]; then
            echo "A platform reported facts we have not committed. Download the"
            echo "artifact, commit it under tools/probed/, and update the matching"
            echo "descriptor in src/jolt/net/target.clj."
          fi
          # Drift is a hard failure: a wrong struct offset is memory corruption,
          # not a formatting nit. A merely-new platform is not.
          exit $drift

  test:
    name: suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt-cache-v0.7.27
      HEGEL_CACHE_DIR: ${{ github.workspace }}/.hegel-native
    strategy:
      fail-fast: false
      matrix:
        # Windows remains ABI-probe-only; see the header comment.
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout jolt-net
        uses: actions/checkout@v4
        with:
          path: jolt-net

      - name: Install released Jolt v0.7.27
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/jolt-bin"
          curl -fsSL \
            https://raw.githubusercontent.com/jolt-lang/jolt/v0.7.27/install \
            | bash -s -- --dir "$install_dir" --version 0.7.27
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Assert released Jolt v0.7.27
        shell: bash
        run: |
          set -euo pipefail
          jolt --version | tee "$RUNNER_TEMP/jolt-version"
          grep -Fxq 'jolt v0.7.27' "$RUNNER_TEMP/jolt-version"

      # Best-effort: libhegel is a downloaded native library, and a release-asset
      # fetch is not a reason to lose the socket coverage. The suite degrades to
      # SKIP for the generative properties if it is unavailable.
      - name: Install jolt-hegel (property-test engine)
        continue-on-error: true
        working-directory: jolt-net
        run: jolt -Srepro -A:test -m hegel.install

      - name: Refresh this platform's probed ABI facts
        working-directory: jolt-net
        shell: bash
        run: ./tools/probe-constants.sh native

      - name: Run the suite
        working-directory: jolt-net
        run: jolt -Srepro -M:test

      # If the freshly probed facts differ from what is committed, surface the
      # exact drift alongside the hard comparison in the tables job.
      - name: Show any drift in the committed tables
        if: always()
        working-directory: jolt-net
        shell: bash
        run: git diff --stat tools/probed/ && git diff tools/probed/ || true

      - name: Upload this platform's probed facts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probed-suite-${{ matrix.os }}
          path: jolt-net/tools/probed/*.edn
