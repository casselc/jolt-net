# jolt-net CI.
#
# Independent jobs prove different things and have very
# different prerequisites:
#
#   probe — compiles tools/probe-constants.c against each platform's OWN headers
#           and runs it. Needs only a C compiler, so it covers every native
#           target in the matrix. This is what turns the per-target socket tables from
#           remembered numbers into checked ones.
#
#   test  — the full suite. Needs the forked joltc host/FFI primitives, which
#           means checking out an exact casselc/jolt revision, plus a Chez
#           Scheme that matches it.
#
# Chez is no longer built from source in this repository. Every runtime lane
# installs the SAME immutable, checksum-pinned toolchain release
# (chez-ci-10.4.1.1) through casselc/jolt-toolchains/setup-chez, pinned by full
# commit SHA and requested with an explicit per-target archive SHA-256. The
# action verifies the archive digest, its descriptor, its internal manifest, the
# extracted inventory, and the `source-runtime` capability before exporting the
# executable this workflow then uses by exact path. A digest mismatch fails the
# job; there is deliberately no source-build fallback to paper over one.
#
# `source-runtime` is the whole capability boundary jolt-net needs: it asserts a
# runnable Chez plus its boot files. It does NOT claim the GNU kernel-development
# inputs (scheme.h, libkernel.a), because nothing here links against the Chez
# kernel -- the suites run Clojure-on-Chez through the source Jolt launcher.
#
# Both Windows architectures have four native socket-runtime gates: W1 blocking
# sockets, W2 FIONBIO/byte I/O/connect completion, W3 real WSAPoll readiness,
# and W4 the PUBLIC jolt.net/open-poller over an owner-independent wake
# transport plus readiness-driven blocking accept. All of them deliberately
# exclude the alias-scoped Hegel dependency, so a socket-runtime result can
# never be confused with a dependency-resolution result and no property-test
# artifact download can erase runtime coverage. The two lanes run the SAME four
# PowerShell scripts with the same timeouts; only the Chez, runtime, and sh
# paths differ.
#
# ABI probing is NOT socket evidence and is kept in separate jobs. A table
# check, a cross-build, a namespace load, or a source-mode selection check says
# nothing about whether a socket was opened.
#
# The Windows ARM64 lanes carry one extra obligation the others do not. This
# runner image ships an x86_64 MinGW gcc, and Windows-on-ARM executes x64
# binaries under emulation, so a job that merely "ran on an ARM runner" can
# produce entirely x86-64 evidence. Six architecture witnesses must
# therefore agree before a socket is opened: the runner label, the selected MSVC
# target, the compiled probe's PE machine type, scheme.exe's PE machine type,
# Chez's own (machine-type), and jolt.host/target as jolt-net's selector sees
# it. Installing a prebuilt toolchain does not weaken any of them: the shipped
# scheme.exe is checked for an AA64 PE header and a tarm64nt machine type on the
# runner itself, exactly as the source-built one was.
# docs/PLATFORM-COVERAGE.md records what each level of evidence does and
# does not claim.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # One reviewed v0.5.12 proposal-fork revision for every source-mode lane.
  # Keep this centralized so a platform cannot silently validate against a
  # different core.
  JOLT_CORE_SHA: 757389df094fa9afb7fa1f1eba5ba83ab297f1a4
  # One immutable toolchain release for all six targets. The per-target archive
  # digests live next to each target below so a wrong pairing cannot pass.
  CHEZ_RELEASE_TAG: chez-ci-10.4.1.1

jobs:
  probe:
    name: probe ABI (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            artifact: linux-x86-64
            expected_os: linux
            expected_arch: x86-64
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            artifact: linux-aarch64
            expected_os: linux
            expected_arch: aarch64
          - name: macOS arm64
            runner: macos-15
            artifact: darwin-aarch64
            expected_os: darwin
            expected_arch: aarch64
          - name: macOS x86_64
            runner: macos-15-intel
            artifact: darwin-x86-64
            expected_os: darwin
            expected_arch: x86-64
          - name: Windows x86_64
            runner: windows-2022
            artifact: windows-x86-64
            expected_os: windows
            expected_arch: x86-64
            # The probe takes the ADDRESS of WSAPoll to pin that function's
            # exact declared signature, so the symbol has to resolve at link
            # time even though the probe opens no socket. Winsock lives in
            # ws2_32 rather than the default libc set, so MinGW needs it named
            # explicitly. The ARM64 lanes link the MSVC equivalent for the
            # same reason. No other target has a Winsock dependency, so this key
            # is absent for them and expands to nothing.
            probe_libs: -lws2_32
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Compile and run the ABI probe
        shell: bash
        run: |
          set -eu
          cc=""
          for c in cc gcc clang; do
            if command -v "$c" >/dev/null 2>&1; then cc="$c"; break; fi
          done
          [ -n "$cc" ] || { echo "no C compiler found"; exit 1; }
          echo "using $cc"
          mkdir -p tools/probed
          "$cc" -O0 -o probe tools/probe-constants.c ${{ matrix.probe_libs }}
          # Strip CR so Windows output is comparable to the others.
          ./probe | tr -d '\r' > probe.edn
          cat probe.edn
          os=$(sed -n 's/^{:os :\([a-z0-9-]*\).*/\1/p' probe.edn)
          arch=$(sed -n 's/^ :arch :\([a-z0-9-]*\).*/\1/p' probe.edn)
          [ "$os" = "${{ matrix.expected_os }}" ] || {
            echo "probe OS mismatch: expected ${{ matrix.expected_os }}, got $os"
            exit 1
          }
          [ "$arch" = "${{ matrix.expected_arch }}" ] || {
            echo "probe architecture mismatch: expected ${{ matrix.expected_arch }}, got $arch"
            exit 1
          }
          cp probe.edn "tools/probed/$os-$arch.edn"
          echo "PROBE_FILE=tools/probed/$os-$arch.edn" >> "$GITHUB_ENV"

      - name: Upload probed ABI facts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: abi-probe-${{ matrix.artifact }}
          # Upload only the file produced on this runner.  The checkout already
          # contains the other committed probes; uploading the whole directory
          # makes the aggregate job compare (for example) the committed Darwin
          # file copied by a Linux runner against Darwin's real probe.
          path: ${{ env.PROBE_FILE }}

  # Windows ARM64 cannot join the matrix above: that job finds a `cc` on PATH and
  # runs it under bash, and on this runner the `cc` it would find is an x86_64
  # MinGW gcc that executes under emulation -- producing an x86_64 probe on an
  # ARM64 host. The toolchain therefore has to be selected explicitly, and the
  # OUTPUT BINARY's PE machine type checked, rather than trusting the runner
  # label. This job is small and deliberately separate from the ARM64 socket
  # gate: drift detection must not depend on a heavyweight runtime lane, and the
  # runtime lane re-probes independently for its own evidence.
  probe-windows-arm64:
    name: probe ABI (Windows aarch64)
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Assert the runner is ARM64
        shell: pwsh
        run: |
          Write-Host "runner.arch      = ${{ runner.arch }}"
          Write-Host "PROCESSOR_ARCH   = $env:PROCESSOR_ARCHITECTURE"
          if ('${{ runner.arch }}' -ne 'ARM64') {
            throw "expected an ARM64 runner, got '${{ runner.arch }}'"
          }

      - name: Compile the ABI probe with the native ARM64 MSVC toolchain
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\tools\msvc-arm64-env.bat" || exit /b 1
          rem ws2_32.lib is required because the probe takes the address of
          rem WSAPoll to pin that function's exact declared signature, so the
          rem symbol has to resolve. The probe still opens no socket.
          cl /nologo /W4 /Od /Fe:"%GITHUB_WORKSPACE%\probe-windows-aarch64.exe" "%GITHUB_WORKSPACE%\tools\probe-constants.c" /link ws2_32.lib || exit /b 1
          call "%GITHUB_WORKSPACE%\tools\assert-arm64-image.bat" "%GITHUB_WORKSPACE%\probe-windows-aarch64.exe" || exit /b 1

      - name: Run the probe and compare it byte-for-byte with the committed facts
        shell: pwsh
        run: |
          ./tools/Probe-WindowsArm64.ps1 `
            -ProbeExe "$env:GITHUB_WORKSPACE\probe-windows-aarch64.exe" `
            -OutFile  "$env:GITHUB_WORKSPACE\probed-arm64\windows-aarch64.edn" `
            -Committed "$env:GITHUB_WORKSPACE\tools\probed\windows-aarch64.edn"

      # Named to match the `abi-probe-*` pattern the drift job downloads, so the
      # ARM64 column is regenerated and diffed on every run exactly like the
      # other five, rather than living in a preview lane nothing gates on.
      - name: Upload probed ABI facts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: abi-probe-windows-aarch64
          path: probed-arm64/windows-aarch64.edn
          if-no-files-found: error

  # Fail if any committed descriptor disagrees with what that platform's headers
  # actually say. A drift here is not cosmetic -- a wrong struct offset is memory
  # corruption -- so this gates rather than warns.
  tables:
    name: tables match probed headers
    needs: [probe, probe-windows-arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: abi-probe-*
          path: probed-artifacts
      - name: Compare committed facts against every freshly probed platform
        shell: bash
        run: |
          set -eu
          echo "== freshly probed on the runners =="
          find probed-artifacts -name '*.edn' | sort
          echo
          drift=0
          new=0
          # Compare against what is COMMITTED (tools/probed in the checkout).
          # Do not copy over it first, or there would be nothing left to compare.
          for f in $(find probed-artifacts -name '*.edn' | sort); do
            base=$(basename "$f")
            committed="tools/probed/$base"
            if [ ! -f "$committed" ]; then
              echo "NEW: $base has no committed counterpart yet"
              echo "     (expected the first time a platform joins CI)"
              sed 's/^/       /' "$f"
              new=1
              continue
            fi
            # Compare with line endings normalized: a Windows runner checks the
            # committed files out as CRLF, which would otherwise show up as
            # every line differing from itself.
            tr -d '\r' < "$committed" > /tmp/a.edn
            tr -d '\r' < "$f" > /tmp/b.edn
            if diff -u /tmp/a.edn /tmp/b.edn > "/tmp/$base.diff"; then
              echo "OK:  $base matches the committed facts"
            else
              echo "DRIFT: $base disagrees with this platform's real headers"
              sed 's/^/       /' "/tmp/$base.diff"
              drift=1
            fi
          done
          echo
          if [ "$new" = 1 ]; then
            echo "A platform reported facts we have not committed. Download the"
            echo "artifact, commit it under tools/probed/, and update the matching"
            echo "descriptor in src/jolt/net/target.clj."
          fi
          # Drift is a hard failure: a wrong struct offset is memory corruption,
          # not a formatting nit. A merely-new platform is not.
          exit $drift

  test:
    name: POSIX runtime suite (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows has a separate portable gate; see the header comment.
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            artifact: linux-x86-64
            toolchain: linux-x86_64
            chez_sha256: 16476cd98fb5cb2e2c0285e88fcd6d57ade9392ca8d7cf603ca38432b4118526
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            artifact: linux-aarch64
            toolchain: linux-aarch64
            chez_sha256: b5b2306d3d6468b5fc7d5836721b09c704c7750f887a6232f1aeeb567d55f5d9
          - name: macOS arm64
            runner: macos-15
            artifact: darwin-aarch64
            toolchain: macos-arm64
            chez_sha256: d5b5a504eed1e0f117b4a3dd23ad0030bb3e5c0da6d6b9d9f990f5f2fa32478f
          - name: macOS x86_64
            runner: macos-15-intel
            artifact: darwin-x86-64
            toolchain: macos-x86_64
            chez_sha256: e4577ad71b1f1e1062c361fa612af60d75378e64dc2869d8c8eefd3d7efdbc62
    steps:
      - name: Checkout jolt-net
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          path: jolt-net

      # The fork carries the six shared host/FFI features jolt-net is built on.
      # Submodules are required: the runtime will not load without vendor/irregex
      # et al.
      - name: Checkout the jolt fork
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          repository: casselc/jolt
          ref: ${{ env.JOLT_CORE_SHA }}
          submodules: recursive
          path: jolt-upstream

      # Only what the suite actually RUNS with. The former build-essential /
      # liblz4-dev / zlib1g-dev / libncurses-dev / uuid-dev / libssl-dev and
      # brew lz4 / openssl@3 sets existed solely to compile Chez from source,
      # and nothing here compiles Chez any more. zstd is the one genuine
      # addition: the POSIX toolchain archives are .tar.zst, so tar needs a zstd
      # it can reach. It is installed only when absent, so a runner image that
      # already ships it pays nothing.
      - name: Ensure zstd is available (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if command -v zstd >/dev/null 2>&1; then
            echo "zstd already present: $(command -v zstd)"
          else
            sudo apt-get update
            sudo apt-get install -y zstd
          fi

      - name: Ensure zstd is available (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if command -v zstd >/dev/null 2>&1; then
            echo "zstd already present: $(command -v zstd)"
          else
            brew install zstd
          fi

      # The immutable, digest-pinned toolchain. Replaces the source checkout,
      # configure/make build, and the hand-rolled actions/cache entry that used
      # to guard it. The action does its own caching of the exact validated
      # archive, keyed by release tag, target, and digest.
      - name: Install the verified Chez toolchain
        id: chez
        uses: casselc/jolt-toolchains/setup-chez@095108ae32659757808064d004855092567d3ad3 # chez-ci-10.4.1.1
        with:
          target: ${{ matrix.toolchain }}
          release-tag: ${{ env.CHEZ_RELEASE_TAG }}
          sha256: ${{ matrix.chez_sha256 }}
          capabilities: source-runtime

      - name: Assert official Chez v10.4.1
        shell: bash
        env:
          CHEZ_EXE: ${{ steps.chez.outputs.executable }}
          CHEZ_TARGET: ${{ steps.chez.outputs.target }}
          CHEZ_ARCHIVE_SHA256: ${{ steps.chez.outputs.archive-sha256 }}
        run: |
          set -euo pipefail
          echo "target        = $CHEZ_TARGET"
          echo "executable    = $CHEZ_EXE"
          echo "archive sha256= $CHEZ_ARCHIVE_SHA256"
          test -x "$CHEZ_EXE"
          "$CHEZ_EXE" --version 2>&1 | tee "$RUNNER_TEMP/chez-version"
          grep -Fq '10.4.1' "$RUNNER_TEMP/chez-version"

      # libhegel 0.30.1 does not publish a Darwin/x86_64 release asset. Keep the
      # full property suite on Intel macOS by building that exact tagged source
      # with its declared minimum Rust toolchain, then using jolt-hegel's
      # documented user-supplied-library path. This is CI input, not a
      # jolt-hegel-owned release artifact.
      - name: Checkout pinned libhegel source (macOS x86_64)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          repository: hegeldev/hegel-rust
          ref: f81c6cceabe3c6695a249588c751a5ce93dffa00
          persist-credentials: false
          path: hegel-rust

      - name: Build pinned libhegel 0.30.1 (macOS x86_64)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        working-directory: hegel-rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.86.0 --profile minimal
          cargo +1.86.0 build --locked -p hegeltest-c --release
          library="$PWD/target/release/libhegel_c.dylib"
          test -f "$library"
          echo "HEGEL_LIBHEGEL_LIBRARY=$library" >> "$GITHUB_ENV"

      # The property layer is part of the gate, not an optional embellishment:
      # never report a green platform row after silently skipping it. Intel
      # macOS uses the exact-source build above because no release asset exists;
      # the remaining targets fetch jolt-hegel's pinned upstream libhegel asset.
      - name: Install jolt-hegel (property-test engine)
        working-directory: jolt-net
        env:
          JOLT_UPSTREAM: ${{ github.workspace }}/jolt-upstream
          JOLT_CHEZ: ${{ steps.chez.outputs.executable }}
        run: ./bin/jnc -A:test -m hegel.install

      - name: Refresh this platform's probed ABI facts
        working-directory: jolt-net
        shell: bash
        run: ./tools/probe-constants.sh native

      # The checked-in Linux/aarch64 descriptor intentionally aliases the
      # x86_64 descriptor instead of relying on a broad :linux fallback. Until
      # the first arm64 artifact is committed, prove that alias directly:
      # normalize only the probe's architecture label, then require every
      # constant, width, sizeof, and offsetof to equal the checked x86_64 facts.
      - name: Verify Linux aarch64 ABI matches the explicit descriptor
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        working-directory: jolt-net
        shell: bash
        run: |
          set -euo pipefail
          sed 's/:arch :aarch64/:arch :x86-64/' \
            tools/probed/linux-aarch64.edn > "$RUNNER_TEMP/linux-aarch64-normalized.edn"
          diff -u tools/probed/linux-x86-64.edn \
            "$RUNNER_TEMP/linux-aarch64-normalized.edn"

      # The source table names Darwin/x86_64 explicitly and documents that it
      # shares SDK facts with arm64. Validate that assertion with this runner's
      # own executed probe. The aggregate tables job still reports the x86_64
      # artifact as NEW until it is reviewed and committed; this comparison is
      # an additional gate, not a silent replacement for that workflow.
      - name: Verify macOS x86_64 ABI matches the explicit descriptor
        if: runner.os == 'macOS' && runner.arch == 'X64'
        working-directory: jolt-net
        shell: bash
        run: |
          set -euo pipefail
          sed 's/:arch :x86-64/:arch :aarch64/' \
            tools/probed/darwin-x86-64.edn > "$RUNNER_TEMP/darwin-x86-64-normalized.edn"
          diff -u tools/probed/darwin-aarch64.edn \
            "$RUNNER_TEMP/darwin-x86-64-normalized.edn"

      - name: Run the suite
        working-directory: jolt-net
        env:
          JOLT_UPSTREAM: ${{ github.workspace }}/jolt-upstream
          JOLT_CHEZ: ${{ steps.chez.outputs.executable }}
          JOLT_HEGEL_REQUIRED: "1"
        run: ./bin/jnc -M:test

      # If the freshly probed facts differ from what is committed, surface the
      # exact drift alongside the hard comparison in the tables job.
      - name: Show any drift in the committed tables
        if: always()
        working-directory: jolt-net
        shell: bash
        run: git diff --stat tools/probed/ && git diff tools/probed/ || true

      - name: Upload this platform's probed facts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: probed-suite-${{ matrix.artifact }}
          path: jolt-net/tools/probed/*.edn

  # The Windows x86-64 W1/W2/W3/W4 runtime gate. W1 and W2 cover the blocking
  # substrate plus non-blocking transitions, byte I/O, and connect completion.
  # W3 adds the real WSAPoll readiness backend and the shared token machinery
  # over it, driven through the internal wake-less adapter. W4 completes the
  # wake and close lifecycle, so the PUBLIC jolt.net/open-poller is exercised
  # here rather than left fail-closed.
  #
  # The runtime substrate is the shared immutable Chez 10.4.1 toolchain, not a
  # source build: MSYS2 and its MinGW gcc/lz4/zlib/make packages existed only to
  # compile Chez on this runner and have no remaining purpose, so the lane is now
  # native PowerShell throughout. The one MSYS2-adjacent thing that WAS still
  # needed is a POSIX sh for the source Jolt launcher, which reads JOLT_SH while
  # starting; that is resolved explicitly below from Git for Windows and handed
  # to the runners, exactly as the ARM64 lane does, rather than left to a
  # hardcoded default path that a future image change could invalidate.
  #
  # Everything else is unchanged: the exact pinned proposal Jolt fork, direct
  # native PowerShell/Chez invocation with the AOT cache disabled, and no
  # jolt-hegel or artifact download in the socket path. Every gate must observe a
  # real child process exit code; a step that cannot see one fails rather than
  # reporting green.
  windows-portable:
    name: Winsock W1/W2/W3/W4 runtime gate (Windows x86-64)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Install the verified Chez toolchain
        id: chez
        uses: casselc/jolt-toolchains/setup-chez@095108ae32659757808064d004855092567d3ad3 # chez-ci-10.4.1.1
        with:
          target: windows-x86_64
          release-tag: ${{ env.CHEZ_RELEASE_TAG }}
          sha256: 360c60496eea2f8aab0e557eb77e9e18b315bb9181938158ae57655aa541b7f8
          capabilities: source-runtime

      - name: Assert official Chez v10.4.1
        shell: pwsh
        env:
          CHEZ_EXE: ${{ steps.chez.outputs.executable }}
          CHEZ_TARGET: ${{ steps.chez.outputs.target }}
          CHEZ_ARCHIVE_SHA256: ${{ steps.chez.outputs.archive-sha256 }}
        run: |
          Write-Host "target         = $env:CHEZ_TARGET"
          Write-Host "executable     = $env:CHEZ_EXE"
          Write-Host "archive sha256 = $env:CHEZ_ARCHIVE_SHA256"
          if (-not (Test-Path $env:CHEZ_EXE)) {
            throw "Chez executable not found: $env:CHEZ_EXE"
          }
          $version = (& $env:CHEZ_EXE --version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "scheme.exe --version exited $LASTEXITCODE" }
          Write-Host "chez version: $version"
          if (-not $version.Contains('10.4.1')) {
            throw "expected Chez Scheme 10.4.1, got: $version"
          }

      - name: Checkout the pinned Jolt fork
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          repository: casselc/jolt
          ref: ${{ env.JOLT_CORE_SHA }}
          submodules: recursive
          path: jolt-upstream

      # The dependency-free aliases resolve no Git dependency, so nothing in the
      # socket path should reach `sh`. The runtime still reads JOLT_SH while
      # starting, and this lane no longer inherits an MSYS2 PATH, so resolve the
      # real sh.exe here and pass what was actually found rather than relying on
      # the scripts' default path.
      - name: Locate the runner's sh.exe
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Git\bin\sh.exe",
            "${env:ProgramFiles(x86)}\Git\bin\sh.exe",
            "C:\Program Files\Git\bin\sh.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          $sh = if ($candidates) { $candidates[0] } else { (Get-Command sh -ErrorAction SilentlyContinue).Source }
          if (-not $sh) {
            throw "no sh.exe found on this runner; JOLT_SH would point at nothing"
          }
          Write-Host "sh.exe = $sh"
          echo "JOLT_NET_SH=$sh" >> $env:GITHUB_ENV

      - name: Run dependency-free native blocking socket suite
        shell: powershell
        env:
          JOLT_NET_CHEZ: ${{ steps.chez.outputs.executable }}
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-blocking.ps1" `
            -JoltNetPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt-upstream" `
            -ChezExe "$env:JOLT_NET_CHEZ" `
            -ShellExe "$env:JOLT_NET_SH" `
            -TimeoutSeconds 90
          if (-not (Test-Path variable:LASTEXITCODE) -or $null -eq $LASTEXITCODE) {
            throw "W1 blocking socket gate: no child exit code was observed; refusing to report success"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run dependency-free native non-blocking socket suite
        shell: powershell
        env:
          JOLT_NET_CHEZ: ${{ steps.chez.outputs.executable }}
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-nonblocking.ps1" `
            -JoltNetPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt-upstream" `
            -ChezExe "$env:JOLT_NET_CHEZ" `
            -ShellExe "$env:JOLT_NET_SH" `
            -TimeoutSeconds 90
          if (-not (Test-Path variable:LASTEXITCODE) -or $null -eq $LASTEXITCODE) {
            throw "W2 non-blocking socket gate: no child exit code was observed; refusing to report success"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Task W3. Real WSAPoll over real Winsock handles, including the shared
      # registration/token machinery driven through the internal wake-less
      # readiness adapter. That adapter is retained deliberately: it is evidence
      # about a poller built WITHOUT a wake transport, and is explicitly not
      # evidence for the W4 one. The timeout is larger than the W1/W2 gates
      # because a refused loopback connect takes roughly 2.5 s to become
      # error-ready and the suite waits on several such real events rather than
      # sleeping past them.
      - name: Run dependency-free native WSAPoll readiness suite
        shell: powershell
        env:
          JOLT_NET_CHEZ: ${{ steps.chez.outputs.executable }}
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-wsapoll.ps1" `
            -JoltNetPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt-upstream" `
            -ChezExe "$env:JOLT_NET_CHEZ" `
            -ShellExe "$env:JOLT_NET_SH" `
            -TimeoutSeconds 240
          if (-not (Test-Path variable:LASTEXITCODE) -or $null -eq $LASTEXITCODE) {
            throw "W3 WSAPoll readiness gate: no child exit code was observed; refusing to report success"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Task W4. The PUBLIC jolt.net/open-poller on Windows over the
      # owner-independent wake transport (a connected IPv4 loopback datagram
      # pair, because WSAPoll accepts only SOCKETs), plus readiness-driven
      # blocking accept and listener close as a bounded completion boundary.
      # 300 s is this gate's documented outer timeout: it waits on real refused
      # connects and forced close/wake/drain interleavings instead of using
      # elapsed sleep as an oracle, and it runs repeated open/close stress to
      # expose owned-socket and wake-handle leaks.
      - name: Run dependency-free native public poller and wake suite
        shell: powershell
        env:
          JOLT_NET_CHEZ: ${{ steps.chez.outputs.executable }}
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-poller-wake.ps1" `
            -JoltNetPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt-upstream" `
            -ChezExe "$env:JOLT_NET_CHEZ" `
            -ShellExe "$env:JOLT_NET_SH" `
            -TimeoutSeconds 300
          if (-not (Test-Path variable:LASTEXITCODE) -or $null -eq $LASTEXITCODE) {
            throw "W4 public poller and wake gate: no child exit code was observed; refusing to report success"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Task W7. The Windows ARM64 socket-runtime gate: the same four suites the
  # x86-64 lane runs, on real loopback sockets, in a native ARM64 process.
  #
  # This lane replaces a non-gating preview, and the thing that made the preview
  # necessary is still true: the runner image carries an x86_64 MinGW gcc and
  # Windows-on-ARM runs x64 binaries under emulation, so "it ran on an ARM
  # runner" is not evidence that ARM64 code did the work. The job therefore
  # requires six architecture checks to agree -- the runner label, selected
  # MSVC target, compiled probe's PE machine type, scheme.exe's PE machine type,
  # Chez's own (machine-type), and jolt.host/target as seen by jolt-net's
  # selector -- before any socket is opened. The final two are checks at
  # different layers but are not independent: target derives arch from Chez's
  # machine type.
  #
  # Chez arrives as the shared digest-pinned tarm64nt toolchain rather than a
  # build.bat source build, which removes the ChezScheme checkout, the
  # machine-type-directory cache, and the MSVC build step. It removes none of the
  # architecture evidence: witnesses 4 and 5 are applied to the SHIPPED
  # scheme.exe on this runner, so an x86-64 archive published under the ARM64
  # target name would fail here rather than run under emulation.
  #
  # Source mode, AOT cache off, no jolt-hegel alias, no artifact download in the
  # socket path, and every gate must observe a real child exit code.
  windows-arm64:
    name: Winsock W1/W2/W3/W4 runtime gate (Windows aarch64)
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 60
    steps:
      - name: Checkout jolt-net
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Assert the runner is ARM64
        shell: pwsh
        run: |
          Write-Host "runner.arch      = ${{ runner.arch }}"
          Write-Host "PROCESSOR_ARCH   = $env:PROCESSOR_ARCHITECTURE"
          Write-Host "OS architecture  = $((Get-CimInstance Win32_OperatingSystem).OSArchitecture)"
          if ('${{ runner.arch }}' -ne 'ARM64') {
            throw "expected an ARM64 runner, got '${{ runner.arch }}'"
          }

      - name: Install the verified Chez toolchain
        id: chez
        uses: casselc/jolt-toolchains/setup-chez@095108ae32659757808064d004855092567d3ad3 # chez-ci-10.4.1.1
        with:
          target: windows-arm64
          release-tag: ${{ env.CHEZ_RELEASE_TAG }}
          sha256: 9bc28462823a1447de6d849e129758a6317cc9deafb8e87414817e7244f149c8
          capabilities: source-runtime

      - name: Compile the ABI probe with the native ARM64 MSVC toolchain
        shell: cmd
        env:
          CHEZ_EXE: ${{ steps.chez.outputs.executable }}
        run: |
          call "%GITHUB_WORKSPACE%\tools\msvc-arm64-env.bat" || exit /b 1
          cl /nologo /W4 /Od /Fe:"%GITHUB_WORKSPACE%\probe-windows-aarch64.exe" "%GITHUB_WORKSPACE%\tools\probe-constants.c" /link ws2_32.lib || exit /b 1
          rem Witness 3: the probe binary really is ARM64.
          call "%GITHUB_WORKSPACE%\tools\assert-arm64-image.bat" "%GITHUB_WORKSPACE%\probe-windows-aarch64.exe" || exit /b 1
          rem Witness 4: so is the Chez that is about to run every socket suite.
          rem The toolchain is installed rather than built here, so this is the
          rem check that an x86-64 image cannot be substituted for it.
          call "%GITHUB_WORKSPACE%\tools\assert-arm64-image.bat" "%CHEZ_EXE%" || exit /b 1

      # An independent re-probe on the runtime runner, byte-compared with the
      # committed descriptor. The drift job does the same from its own smaller
      # lane; doing it here too means the machine that opens the sockets has
      # itself confirmed the facts those sockets are marshalled with.
      - name: Re-probe and byte-compare the committed ARM64 descriptor
        shell: pwsh
        run: |
          ./tools/Probe-WindowsArm64.ps1 `
            -ProbeExe "$env:GITHUB_WORKSPACE\probe-windows-aarch64.exe" `
            -OutFile  "$env:GITHUB_WORKSPACE\probed-arm64-runtime\windows-aarch64.edn" `
            -Committed "$env:GITHUB_WORKSPACE\tools\probed\windows-aarch64.edn"

      - name: Upload native Windows ARM64 runtime-lane ABI evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: probed-runtime-windows-aarch64
          path: probed-arm64-runtime/windows-aarch64.edn
          if-no-files-found: error

      - name: Assert native ARM64 Chez v10.4.1
        shell: pwsh
        env:
          CHEZ_EXE: ${{ steps.chez.outputs.executable }}
          CHEZ_TARGET: ${{ steps.chez.outputs.target }}
          CHEZ_ARCHIVE_SHA256: ${{ steps.chez.outputs.archive-sha256 }}
        run: |
          Write-Host "target         = $env:CHEZ_TARGET"
          Write-Host "executable     = $env:CHEZ_EXE"
          Write-Host "archive sha256 = $env:CHEZ_ARCHIVE_SHA256"
          $scheme = $env:CHEZ_EXE
          if (-not (Test-Path $scheme)) {
            throw "native ARM64 Chez executable not found: $scheme"
          }
          $version = (& $scheme --version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "scheme.exe --version exited $LASTEXITCODE" }
          Write-Host "chez version: $version"
          if (-not $version.Contains('10.4.1')) {
            throw "expected Chez Scheme 10.4.1, got: $version"
          }
          # Witness 5: Chez's own machine type. ta6nt here would mean an
          # emulated x86-64 build slipped in; tarm64nt is the only pass.
          # Chez has no --eval flag -- it would try to LOAD "--eval" as a file --
          # so ask through a one-line script, the same mechanism the suites use.
          $probe = Join-Path $env:RUNNER_TEMP 'machine-type.ss'
          Set-Content -Path $probe -Value '(display (machine-type))(newline)'
          $machine = (& $scheme --script $probe | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "scheme.exe --script exited $LASTEXITCODE" }
          Write-Host "chez machine-type: $machine"
          if ($machine -ne 'tarm64nt') {
            throw "expected Chez machine-type tarm64nt, got '$machine'"
          }
          echo "JOLT_NET_CHEZ=$scheme" >> $env:GITHUB_ENV

      - name: Checkout the pinned Jolt fork
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          repository: casselc/jolt
          ref: ${{ env.JOLT_CORE_SHA }}
          submodules: recursive
          path: jolt-upstream

      # The dependency-free aliases resolve no Git dependency, so nothing in the
      # socket path should reach `sh`. The runtime still reads JOLT_SH while
      # starting, and Git for Windows is not at an identical path on every
      # image, so resolve it here and pass what was actually found rather than
      # handing the runtime a path that may not exist.
      - name: Locate the runner's sh.exe
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Git\bin\sh.exe",
            "${env:ProgramFiles(x86)}\Git\bin\sh.exe",
            "C:\Program Files\Git\bin\sh.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          $sh = if ($candidates) { $candidates[0] } else { (Get-Command sh -ErrorAction SilentlyContinue).Source }
          if (-not $sh) {
            throw "no sh.exe found on this runner; JOLT_SH would point at nothing"
          }
          Write-Host "sh.exe = $sh"
          echo "JOLT_NET_SH=$sh" >> $env:GITHUB_ENV

      # Witness 6: source Jolt and jolt-net's own selector agree, the committed
      # descriptor records :probed provenance, and it matches this machine's
      # freshly probed headers field by field. Opens no socket; the four gates
      # below are the socket evidence.
      - name: Verify native target and descriptor selection
        shell: pwsh
        env:
          JOLT_PWD: ${{ github.workspace }}
          JOLT_AOT_CACHE: 0
        run: |
          $env:JOLT_SH = $env:JOLT_NET_SH
          $runtime = Join-Path $env:GITHUB_WORKSPACE 'jolt-upstream'
          $script = Join-Path $env:GITHUB_WORKSPACE 'test\jolt\net\windows_arm64_runtime.clj'
          Push-Location $runtime
          try {
            & $env:JOLT_NET_CHEZ --script host\chez\cli.ss run $script
            if (-not (Test-Path variable:LASTEXITCODE) -or $null -eq $LASTEXITCODE) {
              throw "target verification: no child exit code was observed; refusing to report success"
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      # The four socket gates. These are the SAME scripts the x86-64 lane runs,
      # with the same timeouts and the same semantics -- only the Chez, runtime,
      # and sh paths differ, which is what those parameters are for. Forking them
      # into ARM-specific copies would mean the two lanes could drift apart while
      # both stayed green, and no platform difference was found that would
      # justify it.
      - name: Run dependency-free native blocking socket suite
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-blocking.ps1" `
            -JoltNetPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt-upstream" `
            -ChezExe "$env:JOLT_NET_CHEZ" `
            -ShellExe "$env:JOLT_NET_SH" `
            -TimeoutSeconds 90
          if (-not (Test-Path variable:LASTEXITCODE) -or $null -eq $LASTEXITCODE) {
            throw "W1 blocking socket gate: no child exit code was observed; refusing to report success"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run dependency-free native non-blocking socket suite
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-nonblocking.ps1" `
            -JoltNetPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt-upstream" `
            -ChezExe "$env:JOLT_NET_CHEZ" `
            -ShellExe "$env:JOLT_NET_SH" `
            -TimeoutSeconds 90
          if (-not (Test-Path variable:LASTEXITCODE) -or $null -eq $LASTEXITCODE) {
            throw "W2 non-blocking socket gate: no child exit code was observed; refusing to report success"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run dependency-free native WSAPoll readiness suite
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-wsapoll.ps1" `
            -JoltNetPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt-upstream" `
            -ChezExe "$env:JOLT_NET_CHEZ" `
            -ShellExe "$env:JOLT_NET_SH" `
            -TimeoutSeconds 240
          if (-not (Test-Path variable:LASTEXITCODE) -or $null -eq $LASTEXITCODE) {
            throw "W3 WSAPoll readiness gate: no child exit code was observed; refusing to report success"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run dependency-free native public poller and wake suite
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-poller-wake.ps1" `
            -JoltNetPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt-upstream" `
            -ChezExe "$env:JOLT_NET_CHEZ" `
            -ShellExe "$env:JOLT_NET_SH" `
            -TimeoutSeconds 300
          if (-not (Test-Path variable:LASTEXITCODE) -or $null -eq $LASTEXITCODE) {
            throw "W4 public poller and wake gate: no child exit code was observed; refusing to report success"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
